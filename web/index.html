<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salary Advisor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2314151A'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='18' fill='white' text-anchor='middle'%3E$%3C/text%3E%3C/svg%3E">
<style>
/* Notch UI: the whole advisor lives in a dark island docked to the top edge of the page.
   Collapsed it is a one-line status pill; expanded it is a tabbed panel (Profile, Range, Skills).
   Colour roles on dark: blue = the model's range, coral = you, slate dashed = BLS baseline, mint = skill advice. */
:root {
  /* page */
  --sky-1: #C9DFFF; --sky-2: #E4EFFF; --sky-3: #F6F9FF; --ink: #10213A; --ink-muted: #4F6079;
  /* island (dark glass) */
  --isl-bg: rgba(18, 19, 24, .93); --isl-text: #F5F4F0; --isl-muted: rgba(245, 244, 240, .62);
  --isl-faint: rgba(245, 244, 240, .42); --isl-line: rgba(255, 255, 255, .08); --isl-field: rgba(255, 255, 255, .07);
  --isl-field-hover: rgba(255, 255, 255, .1);
  --blue: #5B8CFF; --blue-deep: #3A63D8; --blue-soft: rgba(91, 140, 255, .18);
  --coral: #FF7A59; --mint: #2DD4BF; --mint-soft: rgba(45, 212, 191, .16); --bls: #9AA6B8;
  --error: #FF8F7D;
  /* shape + motion */
  --r-pill-bottom: 0 0 22px 22px; --r-panel-bottom: 0 0 30px 30px; --r-field: 12px; --r-pill: 999px;
  --spring: cubic-bezier(.16, 1, .3, 1);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html {
  -webkit-text-size-adjust: 100%; min-height: 100%; background-color: var(--sky-3);
  background-image: linear-gradient(180deg, var(--sky-1) 0, var(--sky-2) 360px, var(--sky-3) 900px);
}
body { margin: 0; min-height: 100vh; font-family: var(--font); color: var(--ink); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---------- sky ---------- */
.sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.cloud {
  position: absolute; aspect-ratio: 3 / 1; animation: drift 120s linear infinite;
  background:
    radial-gradient(closest-side, #fff 96%, transparent) 8% 78% / 34% 62% no-repeat,
    radial-gradient(closest-side, #fff 96%, transparent) 34% 30% / 38% 92% no-repeat,
    radial-gradient(closest-side, #fff 96%, transparent) 62% 46% / 34% 78% no-repeat,
    radial-gradient(closest-side, #fff 96%, transparent) 90% 76% / 28% 56% no-repeat,
    radial-gradient(closest-side, #fff 96%, transparent) 50% 96% / 92% 44% no-repeat;
  filter: drop-shadow(0 18px 18px rgba(64, 110, 190, .16));
}
.cloud.far { width: 260px; opacity: .55; filter: blur(3px); animation-duration: 170s; }
.cloud.mid { width: 380px; opacity: .75; animation-duration: 140s; }
.cloud.near { width: 520px; opacity: .92; }
.c1 { top: 10%; left: 70%; } .c2 { top: 34%; left: -6%; animation-delay: -50s; }
.c3 { top: 66%; left: 46%; animation-delay: -90s; } .c4 { top: 82%; left: 2%; animation-delay: -30s; }
.c5 { top: 50%; left: 80%; animation-delay: -120s; }
@keyframes drift { from { transform: translateX(-15vw); } to { transform: translateX(25vw); } }

/* ---------- page behind the island ---------- */
.brand { position: fixed; top: 18px; left: 22px; z-index: 1; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.02rem; }
.logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: #14151A; color: #fff; font-weight: 800; font-size: 14px; }
.hero {
  position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-end; text-align: center; padding: 0 20px 16vh; transition: opacity .4s var(--spring);
}
body.open .hero { opacity: .35; }
.hero h1 { margin: 0; font-family: var(--font-display); font-size: clamp(2.2rem, 5.4vw, 4rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.04; }
.hero p { margin: 18px auto 0; max-width: 34rem; font-size: 1.05rem; line-height: 1.55; color: var(--ink-muted); }
.hero-cta {
  margin-top: 30px; height: 50px; padding: 0 26px; border: 0; border-radius: var(--r-pill); background: #14151A; color: #fff;
  font-weight: 600; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
  box-shadow: 0 14px 28px -16px rgba(20, 21, 26, .8); transition: transform .2s var(--spring);
}
.hero-cta:hover { transform: translateY(-2px); }
.hero-cta:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
kbd { font-family: inherit; font-size: .78rem; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.16); }

/* ---------- the island ---------- */
.island {
  position: fixed; top: 0; left: 50%; z-index: 10; transform: translateX(-50%);
  width: 300px; height: 38px; overflow: hidden; color: var(--isl-text);
  background: var(--isl-bg); border-radius: var(--r-pill-bottom);
  -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: 0 18px 46px rgba(0, 0, 0, .22), inset 0 -1px 0 rgba(255, 255, 255, .06);
  transition: width .52s var(--spring), height .52s var(--spring), border-radius .52s var(--spring), box-shadow .22s;
}
.island.expanded { border-radius: var(--r-panel-bottom); box-shadow: 0 28px 70px rgba(0, 0, 0, .32), inset 0 -1px 0 rgba(255, 255, 255, .06); }
.island > .face { position: absolute; top: 0; left: 50%; transform: translateX(-50%); transition: opacity .22s ease; }
.island:not(.expanded) > .panel, .island.expanded > .pill { opacity: 0; pointer-events: none; }

/* collapsed: status pill */
.pill {
  display: inline-flex; align-items: center; gap: 10px; height: 38px; padding: 0 16px 0 14px; white-space: nowrap;
  border: 0; background: none; cursor: pointer; font-size: .9rem; font-weight: 600;
}
.pill:focus-visible { outline: none; }
.island:has(.pill:focus-visible) { box-shadow: 0 0 0 3px var(--blue), 0 18px 46px rgba(0, 0, 0, .22); }
.pill-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); flex: none; }
.pill-dot.is-you { background: var(--coral); box-shadow: 0 0 0 3px rgba(255, 122, 89, .2); }
.pill-dot.busy { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.6); opacity: .6; } }
.pill-sub { color: var(--isl-muted); font-weight: 500; }
.glyph { position: relative; width: 46px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); flex: none; margin-left: 4px; }
.glyph i { position: absolute; top: 0; bottom: 0; left: 18%; width: 64%; border-radius: 3px; background: var(--blue); }
.glyph b { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--coral); border: 2px solid #15161B; left: 40%; transition: left .6s var(--spring); }
.glyph.idle b { display: none; }

/* expanded: panel */
.panel { width: min(560px, calc(100vw - 16px)); padding: 14px 20px 20px; }
.panel-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.tabs { display: flex; gap: 4px; padding: 3px; border-radius: var(--r-pill); background: rgba(255, 255, 255, .06); }
.tab {
  height: 32px; padding: 0 14px; border: 0; border-radius: var(--r-pill); background: none; cursor: pointer;
  font-size: .86rem; font-weight: 600; color: var(--isl-muted); display: inline-flex; align-items: center; gap: 6px;
  transition: background .2s, color .2s;
}
.tab:hover { color: var(--isl-text); }
.tab[aria-selected="true"] { background: rgba(255, 255, 255, .12); color: var(--isl-text); }
.tab:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: .7rem; display: inline-grid; place-items: center; background: var(--mint-soft); color: var(--mint); }
.top-actions { margin-left: auto; display: flex; gap: 6px; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .08); color: var(--isl-text);
  display: grid; place-items: center; cursor: pointer; transition: background .2s;
}
.icon-btn:hover { background: rgba(255, 255, 255, .16); }
.icon-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.tabpanel { animation: fade .3s var(--spring); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- profile form (dark) ---------- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2.money-row { grid-template-columns: 1fr 120px; }
.field { margin-bottom: 12px; }
.field > label, .field > .label { display: block; font-size: .76rem; font-weight: 600; color: var(--isl-muted); margin-bottom: 6px; letter-spacing: .01em; }
.input {
  width: 100%; height: 42px; padding: 0 12px; border-radius: var(--r-field); border: 1px solid var(--isl-line);
  background: var(--isl-field); color: var(--isl-text); font-size: 16px; outline: none; transition: border-color .15s, background .15s, box-shadow .15s;
}
.input::placeholder { color: var(--isl-faint); }
.input:hover { background: var(--isl-field-hover); }
.input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.unit { position: relative; }
.unit .input { padding-right: 44px; }
.unit::after { content: attr(data-unit); position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--isl-faint); font-size: .8rem; font-weight: 600; pointer-events: none; }
.money .input { padding-left: 26px; }
.money::before { content: "$"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--isl-muted); font-weight: 600; }
.field.invalid .input { border-color: var(--error); background: rgba(255, 143, 125, .08); }
.err { display: none; margin-top: 5px; font-size: .78rem; font-weight: 600; color: var(--error); }
.field.invalid .err { display: block; }

.upload {
  width: 100%; height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: var(--r-field);
  border: 1px dashed rgba(255, 255, 255, .2); background: transparent; cursor: pointer; text-align: left; font-size: .88rem; transition: border-color .15s, background .15s;
}
.upload:hover, .upload.over { border-color: var(--blue); background: var(--blue-soft); }
.upload:focus-visible { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.upload svg { color: var(--blue); flex: none; }
.upload b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upload span { color: var(--isl-faint); margin-left: auto; white-space: nowrap; font-size: .8rem; }
.upload.has-file { border-style: solid; border-color: var(--isl-line); background: var(--isl-field); }
.note { margin: 6px 0 0; font-size: .78rem; color: var(--isl-muted); }
.note:empty { display: none; }
.note.warn { color: var(--coral); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  height: 30px; padding: 0 7px 0 11px; border: 0; border-radius: var(--r-pill); background: var(--blue-soft); color: #C9D8FF;
  font-size: .8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
}
.chip:hover { background: rgba(91, 140, 255, .28); }
.chip:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.chip svg { opacity: .7; }
.add-skill {
  height: 30px; padding: 0 26px 0 11px; border-radius: var(--r-pill); border: 1px dashed rgba(255, 255, 255, .22); background-color: transparent;
  color: var(--isl-muted); font-size: .8rem; font-weight: 600; cursor: pointer; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 13px) 13px, calc(100% - 9px) 13px; background-size: 4px 4px; background-repeat: no-repeat;
}
.add-skill option { color: #111; }
.add-skill:focus-visible { outline: none; border-color: var(--blue); }

.primary {
  width: 100%; height: 46px; margin-top: 6px; border: 0; border-radius: var(--r-pill); background: #F5F4F0; color: #14151A;
  font-weight: 700; font-size: .95rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .15s var(--spring), background .15s;
}
.primary:hover { background: #fff; transform: translateY(-1px); }
.primary:active { transform: translateY(1px) scale(.99); }
.primary:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.primary[disabled] { opacity: .7; cursor: progress; }
.ghost-btn {
  height: 36px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--isl-line); background: rgba(255,255,255,.04);
  color: var(--isl-text); font-size: .84rem; font-weight: 600; cursor: pointer;
}
.ghost-btn:hover { background: rgba(255, 255, 255, .1); }
.ghost-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

/* ---------- range tab ---------- */
.verdict { margin: 4px 0 0; font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.verdict em { font-style: normal; color: var(--coral); }
.context { margin: 6px 0 0; color: var(--isl-muted); font-size: .9rem; line-height: 1.45; }
.context b { color: var(--isl-text); font-weight: 600; }
.chart { position: relative; margin: 50px 6px 0; }
.track { position: relative; height: 16px; border-radius: var(--r-pill); background: rgba(255, 255, 255, .08); }
.band { position: absolute; top: 0; bottom: 0; border-radius: var(--r-pill); background: linear-gradient(90deg, var(--blue-deep), var(--blue) 50%, var(--blue-deep)); }
.mark-p50 { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: #fff; }
.mark-bls { position: absolute; top: -13px; bottom: -13px; width: 0; margin-left: -1px; border-left: 2px dashed var(--bls); }
.bls-tag { position: absolute; top: 100%; margin-top: 2px; transform: translateX(-50%); font-size: .7rem; font-weight: 700; color: var(--bls); white-space: nowrap; }
.you { position: absolute; bottom: 8px; width: 0; transition: left .8s var(--spring); }
.you-pin { position: absolute; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; transform: translateX(-50%); }
.you-pin.edge-l { transform: translateX(-18px); align-items: flex-start; }
.you-pin.edge-r { transform: translateX(calc(-100% + 18px)); align-items: flex-end; }
.you-label { white-space: nowrap; background: var(--coral); color: #1A0D08; font-weight: 800; font-size: .8rem; padding: 4px 10px; border-radius: var(--r-pill); }
.you-stem { width: 2px; height: 10px; background: var(--coral); }
.you-dot { width: 16px; height: 16px; border-radius: 50%; background: #15161B; border: 4px solid var(--coral); margin-bottom: -8px; }
.edge-l .you-stem { margin-left: 8px; } .edge-r .you-stem { margin-right: 8px; }
.ticks { position: relative; height: 40px; margin-top: 18px; }
.tick { position: absolute; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; white-space: nowrap; }
.tick.l { transform: none; align-items: flex-start; } .tick.r { transform: translateX(-100%); align-items: flex-end; }
.tick b { font-size: .92rem; font-weight: 700; }
.tick span { font-size: .72rem; color: var(--isl-muted); font-weight: 600; }
.tick .bls-note { color: var(--bls); }
.legend { margin: 14px 0 0; font-size: .76rem; color: var(--isl-faint); line-height: 1.45; }
.actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--isl-line); }
.actions .ghost-btn:last-child { margin-left: auto; }

/* ---------- skills tab ---------- */
.skills-head { margin: 2px 0 10px; font-size: .84rem; color: var(--isl-muted); line-height: 1.45; }
.recs { list-style: none; margin: 0; padding: 0; }
.rec { padding: 11px 0; border-top: 1px solid var(--isl-line); display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; align-items: center; }
.rec:first-child { border-top: 0; }
.rec-name { font-weight: 600; font-size: .92rem; }
.rec-val { font-weight: 700; font-size: .92rem; color: var(--mint); }
.rec-val small { color: var(--isl-faint); font-weight: 600; }
.rec-bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--mint-soft); overflow: hidden; }
.rec-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--mint); transition: width .7s var(--spring); }
.basis { margin: 10px 0 0; font-size: .76rem; color: var(--isl-faint); }

.empty { padding: 18px 0 6px; }
.empty h2 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
.empty p { margin: 6px 0 14px; color: var(--isl-muted); font-size: .9rem; line-height: 1.45; }

/* ---------- desktop app (src/desktop): the native window is the island ----------
   The island fills the window; Python sizes and shapes the window to match, so no size transition here. */
html.desktop, html.desktop body { background: #121318; min-height: 0; height: 100%; overflow: hidden; }
html.desktop .sky, html.desktop .brand, html.desktop .hero { display: none; }
html.desktop .island {
  inset: 0; left: 0; transform: none; width: 100% !important; height: 100% !important; border-radius: 0;
  background: #121318; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; transition: none;
}
html.desktop .island.expanded { box-shadow: none; border-radius: 0; }
html.desktop .panel { width: 560px; }  /* fixed: 100vw would follow the (collapsed) window width */
html.desktop .island.expanded > .pill, html.desktop .island:not(.expanded) > .panel { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 600px) {
  .brand { display: none; }
  .panel { padding: 12px 14px 16px; }
  .tab { padding: 0 11px; }
  .grid2 { grid-template-columns: 1fr; gap: 0; }
  .grid2.money-row { grid-template-columns: 1fr 104px; gap: 10px; }
  .hero { padding-bottom: 12vh; }
  .pill-sub, .hero-cta kbd { display: none; }
}
/* The desktop window is only as wide as the island (< 600 px); keep the desktop layout, not the phone one. */
html.desktop .panel { padding: 14px 20px 20px; }
html.desktop .tab { padding: 0 14px; }
html.desktop .grid2 { grid-template-columns: 1fr 1fr; gap: 12px; }
html.desktop .grid2.money-row { grid-template-columns: 1fr 120px; }
html.desktop .pill-sub { display: inline; }
</style>
</head>
<body class="open">
<div class="sky" aria-hidden="true">
  <div class="cloud far c1"></div><div class="cloud far c5"></div>
  <div class="cloud mid c2"></div><div class="cloud mid c3"></div><div class="cloud near c4"></div>
</div>

<div class="brand" aria-hidden="true"><span class="logo">$</span>Salary Advisor</div>

<div class="island expanded" id="island">
  <!-- collapsed face -->
  <button class="face pill" id="pill" type="button" aria-expanded="true" aria-controls="panel" tabindex="-1">
    <span class="pill-dot" id="pill-dot"></span>
    <span id="pill-text">Check your pay</span>
    <span class="pill-sub" id="pill-sub"></span>
    <span class="glyph idle" id="glyph" aria-hidden="true"><i></i><b></b></span>
  </button>

  <!-- expanded face -->
  <section class="face panel" id="panel" aria-label="Salary Advisor">
    <div class="panel-top">
      <div class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" role="tab" id="tab-profile" aria-controls="tp-profile" aria-selected="true">Profile</button>
        <button class="tab" role="tab" id="tab-range" aria-controls="tp-range" aria-selected="false" tabindex="-1">Range</button>
        <button class="tab" role="tab" id="tab-skills" aria-controls="tp-skills" aria-selected="false" tabindex="-1">Skills <span class="badge" id="skills-badge" hidden></span></button>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="collapse" type="button" aria-label="Collapse to the top bar (Esc)" title="Collapse (Esc)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <!-- Profile -->
    <form class="tabpanel" id="tp-profile" role="tabpanel" aria-labelledby="tab-profile" novalidate>
      <div class="grid2">
        <div class="field" data-field="title">
          <label for="title">Job title</label>
          <input class="input" id="title" value="Data Scientist">
          <div class="err" id="title-err">Enter a job title</div>
        </div>
        <div class="field" data-field="location">
          <label for="location">Location</label>
          <input class="input" id="location" value="San Jose, CA" placeholder="City, state">
          <div class="err" id="location-err">Enter a city and state</div>
        </div>
      </div>
      <div class="grid2 money-row">
        <div class="field">
          <label for="salary">Current or offered salary</label>
          <div class="unit money" data-unit="/ yr"><input class="input" id="salary" value="110,000" inputmode="numeric" placeholder="Optional"></div>
        </div>
        <div class="field">
          <label for="years">Experience</label>
          <div class="unit" data-unit="yrs"><input class="input" id="years" inputmode="numeric" placeholder="e.g. 2"></div>
        </div>
      </div>
      <div class="field">
        <span class="label">Resume · optional</span>
        <button type="button" class="upload" id="upload">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
          <b id="upload-name">Upload to fill your skills</b><span id="upload-hint">PDF, DOCX, TXT</span>
        </button>
        <input type="file" id="file" accept=".pdf,.docx,.txt" hidden>
        <p class="note" id="note" aria-live="polite"></p>
      </div>
      <div class="field">
        <span class="label">Your skills</span>
        <div class="chips" id="chips"></div>
      </div>
      <button class="primary" id="cta" type="submit">Estimate my range</button>
    </form>

    <!-- Range -->
    <div class="tabpanel" id="tp-range" role="tabpanel" aria-labelledby="tab-range" hidden></div>
    <!-- Skills -->
    <div class="tabpanel" id="tp-skills" role="tabpanel" aria-labelledby="tab-skills" hidden></div>
  </section>
</div>

<main class="hero">
  <h1>Is your pay on target?</h1>
  <p>Everything lives in the bar at the top: your profile, where your pay sits in the market range for your role and city, and the skills linked to higher pay.</p>
  <button class="hero-cta" id="hero-cta" type="button">Open the advisor <kbd>/</kbd></button>
</main>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const money = (x) => usd.format(x);
const short = (x) => (x >= 1000 ? `$${Math.round(x / 1000)}k` : money(x));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const digits = (s) => s.replace(/[^\d]/g, "");
const X_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

const island = $("#island"), pill = $("#pill"), panel = $("#panel");
const state = { all: [], labels: {}, skills: [], result: null, profile: null, tab: "profile" };

/* ================= island: size, expand, collapse ================= */
const DESKTOP = document.documentElement.classList.contains("desktop");
let lastFit = "";
function fit() {
  const open = island.classList.contains("expanded");
  const face = open ? panel : pill;
  const w = face.offsetWidth, h = face.offsetHeight;
  island.style.width = w + "px";
  island.style.height = h + "px";
  // Desktop app: ask Python to size and shape the native window to the island (see src/desktop/app.py).
  if (DESKTOP && window.pywebview?.api?.fit && w && h) {
    const key = `${w}x${h}x${open}`;
    if (key !== lastFit) { lastFit = key; window.pywebview.api.fit(w, h, open ? 30 : 22, window.devicePixelRatio || 1); }
  }
}
window.addEventListener("pywebviewready", () => { lastFit = ""; fit(); });
new ResizeObserver(fit).observe(panel);
new ResizeObserver(fit).observe(pill);
window.addEventListener("resize", fit);

function expand(tab) {
  island.classList.add("expanded"); document.body.classList.add("open");
  pill.setAttribute("aria-expanded", "true"); pill.tabIndex = -1;
  panel.inert = false;
  if (tab) selectTab(tab, false);
  fit();
  setTimeout(() => (document.querySelector(`#tab-${state.tab}`)).focus({ preventScroll: true }), 60);
}
function collapse() {
  island.classList.remove("expanded"); document.body.classList.remove("open");
  pill.setAttribute("aria-expanded", "false"); pill.tabIndex = 0;
  panel.inert = true;
  fit();
}
pill.addEventListener("click", () => expand());
$("#collapse").addEventListener("click", () => { collapse(); pill.focus(); });
$("#hero-cta").addEventListener("click", () => expand());
document.addEventListener("keydown", (e) => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
  if (e.key === "Escape" && island.classList.contains("expanded")) { collapse(); pill.focus(); }
  else if (e.key === "/" && !typing && !island.classList.contains("expanded")) { e.preventDefault(); expand(); }
});
document.addEventListener("pointerdown", (e) => {
  if (island.classList.contains("expanded") && !island.contains(e.target) && !e.target.closest("#hero-cta")) collapse();
});

/* ================= tabs ================= */
const TABS = ["profile", "range", "skills"];
function selectTab(name, focus = true) {
  state.tab = name;
  TABS.forEach((t) => {
    const on = t === name, tab = $(`#tab-${t}`);
    tab.setAttribute("aria-selected", on); tab.tabIndex = on ? 0 : -1;
    $(`#tp-${t}`).hidden = !on;
  });
  if (focus) $(`#tab-${name}`).focus();
  fit();
}
TABS.forEach((t) => $(`#tab-${t}`).addEventListener("click", () => selectTab(t)));
$(".tabs").addEventListener("keydown", (e) => {
  const i = TABS.indexOf(state.tab);
  if (e.key === "ArrowRight") selectTab(TABS[(i + 1) % 3]);
  if (e.key === "ArrowLeft") selectTab(TABS[(i + 2) % 3]);
});

/* ================= collapsed status line ================= */
function setPill({ text, sub = "", dot = "", glyphAt = null }) {
  $("#pill-text").textContent = text;
  $("#pill-sub").textContent = sub;
  $("#pill-dot").className = "pill-dot " + dot;
  const g = $("#glyph");
  g.classList.toggle("idle", glyphAt == null);
  if (glyphAt != null) g.querySelector("b").style.left = glyphAt + "%";
}

/* ================= profile: skills, formatting, resume ================= */
function renderChips() {
  const chips = state.skills.map((k) =>
    `<button type="button" class="chip" data-skill="${k}" aria-label="Remove ${esc(state.labels[k])}">${esc(state.labels[k])}${X_ICON}</button>`).join("");
  const left = state.all.filter((s) => !state.skills.includes(s.key));
  const add = left.length ? `<select class="add-skill" id="add-skill" aria-label="Add a skill"><option value="">+ Add skill</option>${
    left.map((s) => `<option value="${s.key}">${esc(s.label)}</option>`).join("")}</select>` : "";
  $("#chips").innerHTML = chips + add;
}
$("#chips").addEventListener("click", (e) => {
  const c = e.target.closest(".chip");
  if (c) { state.skills = state.skills.filter((k) => k !== c.dataset.skill); renderChips(); $("#add-skill")?.focus(); }
});
$("#chips").addEventListener("change", (e) => {
  if (e.target.id === "add-skill" && e.target.value) { state.skills.push(e.target.value); renderChips(); $("#add-skill")?.focus(); }
});
$("#salary").addEventListener("input", (e) => { const d = digits(e.target.value).slice(0, 7); e.target.value = d ? Number(d).toLocaleString("en-US") : ""; });
$("#years").addEventListener("input", (e) => { e.target.value = digits(e.target.value).slice(0, 2); });

const upload = $("#upload"), file = $("#file"), note = $("#note");
upload.addEventListener("click", () => file.click());
["dragenter", "dragover"].forEach((t) => upload.addEventListener(t, (e) => { e.preventDefault(); upload.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => upload.addEventListener(t, () => upload.classList.remove("over")));
upload.addEventListener("drop", (e) => { e.preventDefault(); e.dataTransfer.files[0] && handleFile(e.dataTransfer.files[0]); });
file.addEventListener("change", () => file.files[0] && handleFile(file.files[0]));
function setNote(t, warn = false) { note.textContent = t; note.classList.toggle("warn", warn); fit(); }

async function handleFile(f) {
  if (!/\.(pdf|docx|txt)$/i.test(f.name)) return setNote("Use a PDF, DOCX or TXT file.", true);
  if (f.size > 10 * 1024 * 1024) return setNote("This file is over 10 MB. Try a smaller copy.", true);
  $("#upload-name").textContent = f.name; $("#upload-hint").textContent = "Reading…"; upload.classList.add("has-file");
  try {
    const data = await new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = bad; r.readAsDataURL(f); });
    const res = await fetch("/api/parse-resume", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: f.name, data }) });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error);
    state.skills = [...new Set([...state.skills, ...out.skills])]; renderChips();
    if (out.years != null) $("#years").value = Math.round(out.years);
    $("#upload-hint").textContent = "Replace";
    if (!out.skills.length && out.years == null) setNote("No skills found. If it's a scanned PDF, try a DOCX or add skills below.", true);
    else setNote(`Found ${out.skills.length} skill${out.skills.length === 1 ? "" : "s"}${out.years != null ? ` and ${out.years} years of experience` : ""}. Edit below if anything is off.`);
  } catch {
    $("#upload-hint").textContent = "Try another"; setNote("We couldn't read this file. Try another PDF, DOCX or TXT, or add skills below.", true);
  }
}

function setInvalid(field, msg) {
  const el = document.querySelector(`[data-field="${field}"]`); if (!el) return;
  el.classList.toggle("invalid", !!msg);
  const input = el.querySelector("input"); input.setAttribute("aria-invalid", msg ? "true" : "false");
  const err = el.querySelector(".err"); if (msg) { err.textContent = msg; input.setAttribute("aria-describedby", err.id); }
  fit();
}
["title", "location"].forEach((f) => $("#" + f).addEventListener("input", () => setInvalid(f, "")));

/* ================= results ================= */
const pct = (x, lo, hi) => Math.min(Math.max(((x - lo) / (hi - lo)) * 100, 0), 100);
function scale(r, cur) {
  const v = [r.p10, r.p90, r.bls_median].concat(cur ? [cur] : []);
  let lo = Math.min(...v), hi = Math.max(...v); const pad = (hi - lo) * 0.08 || hi * 0.1;
  return [lo - pad, hi + pad];
}
function verdict(cur, r) {
  const gap = cur - r.p50;
  if (cur < r.p10) return { long: `You're <em>below the market range</em>`, short: "Below the market range" };
  if (cur > r.p90) return { long: `You're <em>above the market range</em>`, short: "Above the market range" };
  if (Math.abs(gap) < 500) return { long: `You're <em>right at typical pay</em>`, short: "Right at typical pay" };
  const side = gap < 0 ? "below" : "above";
  return { long: `You're <em>${money(Math.abs(gap))} ${side}</em> typical`, short: `${short(Math.abs(gap))} ${side} typical` };
}

function emptyTab(title, body) {
  return `<div class="empty"><h2>${title}</h2><p>${body}</p><button type="button" class="ghost-btn" data-go="profile">Go to profile</button></div>`;
}

function renderRange(p, r) {
  const cur = p.salary, [lo, hi] = scale(r, cur);
  const x = { p10: pct(r.p10, lo, hi), p50: pct(r.p50, lo, hi), p90: pct(r.p90, lo, hi), bls: pct(r.bls_median, lo, hi) };
  const same = Math.abs(r.bls_median - r.p50) / r.p50 < 0.01;
  const where = `<b>${esc(p.title)}</b> in <b>${esc(p.location)}</b>`;
  const head = cur
    ? `<h2 class="verdict">${verdict(cur, r).long}</h2><p class="context">Typical pay for ${where}: <b>${money(r.p50)}</b> a year.</p>`
    : `<h2 class="verdict">Typical pay is ${money(r.p50)}</h2><p class="context">For ${where}. <button type="button" class="ghost-btn" data-go="profile" style="height:28px;margin-left:4px">Add your salary</button></p>`;
  let you = "";
  if (cur) {
    const xy = pct(cur, lo, hi), edge = xy < 10 ? " edge-l" : xy > 90 ? " edge-r" : "";
    you = `<div class="you" data-x="${xy.toFixed(2)}" style="left:${x.p10.toFixed(2)}%"><div class="you-pin${edge}"><span class="you-label">You · ${short(cur)}</span><span class="you-stem"></span><span class="you-dot"></span></div></div>`;
  }
  return `${head}
    <div class="chart" role="img" aria-label="Market range ${money(r.p10)} to ${money(r.p90)}, typical ${money(r.p50)}${cur ? `, you ${money(cur)}` : ""}, BLS median ${money(r.bls_median)}">
      <div class="track">
        <div class="band" style="left:${x.p10.toFixed(2)}%;width:${(x.p90 - x.p10).toFixed(2)}%"></div>
        <div class="mark-bls" style="left:${x.bls.toFixed(2)}%">${same ? "" : `<span class="bls-tag">BLS ${short(r.bls_median)}</span>`}</div>
        <div class="mark-p50" style="left:${x.p50.toFixed(2)}%"></div>
        ${you}
      </div>
      <div class="ticks">
        <div class="tick${x.p10 < 8 ? " l" : ""}" style="left:${x.p10.toFixed(2)}%"><b>${short(r.p10)}</b><span>Low · P10</span></div>
        <div class="tick" style="left:${x.p50.toFixed(2)}%"><b>${short(r.p50)}</b><span>Typical · P50</span>${same ? '<span class="bls-note">= BLS median</span>' : ""}</div>
        <div class="tick${x.p90 > 92 ? " r" : ""}" style="left:${x.p90.toFixed(2)}%"><b>${short(r.p90)}</b><span>High · P90</span></div>
      </div>
    </div>
    <p class="legend">Blue bar: the middle 80% of pay for similar roles. Dashed line: BLS median wage for this occupation and area.</p>
    <div class="actions"><button type="button" class="ghost-btn" data-go="profile">Edit profile</button><button type="button" class="ghost-btn" data-go="skills">Skills linked to higher pay →</button></div>`;
}

function renderSkills(p, recs) {
  if (!recs.length) return `<div class="empty"><h2>You list every skill we track</h2><p>There's nothing missing from our skill list.</p></div>`;
  const top = Math.max(...recs.map((r) => r.delta)) || 1, n = p.skills.length;
  const rows = recs.map((r) => `<li class="rec"><span class="rec-name">${esc(r.label)}</span><span class="rec-val">+${money(r.delta)} <small>/ yr</small></span>
      <span class="rec-bar"><i data-w="${Math.max(r.delta / top, 0.04) * 100}"></i></span></li>`).join("");
  const basis = n ? `Based on your ${n} skill${n === 1 ? "" : "s"}${p.years != null ? ` and ${p.years} years of experience` : ""}.`
                  : "You haven't listed skills, so every skill counts as missing. Add yours in Profile for sharper advice.";
  return `<p class="skills-head">Associated change in typical pay if the skill were on your profile. Not a guaranteed raise.</p>
    <ul class="recs">${rows}</ul><p class="basis">${basis}</p>`;
}

function animateIn(root) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.querySelectorAll(".you").forEach((el) => (el.style.left = el.dataset.x + "%"));
    root.querySelectorAll(".rec-bar i").forEach((el) => (el.style.width = el.dataset.w + "%"));
  }));
}
panel.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]")?.dataset.go;
  if (!go) return;
  selectTab(go);
  if (go === "profile" && e.target.textContent.includes("salary")) $("#salary").focus();
});
$("#tab-skills").addEventListener("click", () => animateIn($("#tp-skills")));

function showEmptyResults() {
  $("#tp-range").innerHTML = emptyTab("No estimate yet", "Fill in your profile and select Estimate my range. Your pay is placed on the market range for the role and city.");
  $("#tp-skills").innerHTML = emptyTab("No estimate yet", "Estimate your range first, then see which skills are linked to higher pay in similar roles.");
}

/* ================= submit ================= */
$("#tp-profile").addEventListener("submit", async (e) => {
  e.preventDefault();
  const p = {
    title: $("#title").value.trim(), location: $("#location").value.trim(),
    salary: Number(digits($("#salary").value)) || null,
    years: $("#years").value === "" ? null : Number($("#years").value), skills: [...state.skills],
  };
  const errors = {};
  if (!p.title) errors.title = "Enter a job title";
  if (!p.location) errors.location = "Enter a city and state";
  ["title", "location"].forEach((f) => setInvalid(f, errors[f]));
  if (Object.keys(errors).length) { $("#" + Object.keys(errors)[0]).focus(); return; }

  const cta = $("#cta"); cta.disabled = true; cta.textContent = "Estimating…";
  setPill({ text: "Estimating…", dot: "busy" });
  try {
    const res = await fetch("/api/estimate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(p) });
    const out = await res.json();
    if (res.status === 422 && out.errors) { Object.entries(out.errors).forEach(([f, m]) => setInvalid(f, m)); setPill({ text: "Check your pay" }); return; }
    if (!res.ok) throw new Error(out.error);
    const r = out.range;
    $("#tp-range").innerHTML = renderRange(p, r);
    $("#tp-skills").innerHTML = renderSkills(p, out.recommendations);
    const sb = $("#skills-badge"); sb.hidden = !out.recommendations.length; sb.textContent = out.recommendations.length;
    if (p.salary) {
      const [lo, hi] = scale(r, p.salary);
      setPill({ text: `You're ${verdict(p.salary, r).short}`, sub: `· ${p.title}`, dot: "is-you", glyphAt: pct(p.salary, lo, hi) });
    } else {
      setPill({ text: `Typical pay ${short(r.p50)}`, sub: `· ${p.title}` });
    }
    selectTab("range", false);
    animateIn($("#tp-range"));
  } catch {
    $("#tp-range").innerHTML = emptyTab("We couldn't estimate this role", "Try a more common job title, such as Software Engineer or Data Analyst, or a nearby large city.");
    setPill({ text: "Couldn't estimate", sub: "· open to edit" });
    selectTab("range", false);
  } finally {
    cta.disabled = false; cta.textContent = "Estimate my range";
  }
});

/* ================= start ================= */
showEmptyResults();
// Desktop app starts as a quiet pill at the top of the screen (class start-open is a test switch).
if (DESKTOP && !document.documentElement.classList.contains("start-open")) collapse();
fit();
fetch("/api/skills").then((r) => r.json()).then((all) => {
  state.all = all; all.forEach((s) => (state.labels[s.key] = s.label)); renderChips(); fit();
}).catch(() => { $("#chips").innerHTML = '<p class="note warn">Can\'t reach the server. Is <code>python -m src.app.server</code> running?</p>'; fit(); });
</script>
</body>
</html>
